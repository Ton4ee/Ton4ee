<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Antonio Puceski — Software Engineer</title>
  <desc id="description">Animated navy and blue profile banner.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.48" stop-color="#0f2747"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#7dd3fc" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>

  <circle cx="105" cy="72" r="190" fill="url(#glow)" opacity="0.32">
    <animate attributeName="cx" values="105;250;105" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.22;0.42;0.22" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="310" r="230" fill="url(#glow)" opacity="0.28">
    <animate attributeName="cx" values="1080;930;1080" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.38;0.18" dur="7s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.5" fill="none" stroke="#38bdf8">
    <circle cx="1010" cy="90" r="36">
      <animate attributeName="r" values="34;48;34" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="90" r="58">
      <animate attributeName="r" values="52;70;52" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.45;0.05;0.45" dur="5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(76 78)">
    <rect width="184" height="34" rx="17" fill="#0ea5e9" fill-opacity="0.16" stroke="#38bdf8" stroke-opacity="0.58"/>
    <circle cx="20" cy="17" r="5" fill="#22d3ee">
      <animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="36" y="23" fill="#bae6fd" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1.1">OPEN TO CONNECT</text>
  </g>

  <text x="76" y="176" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="750" letter-spacing="-1.5">Antonio Puceski</text>
  <text x="78" y="220" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Software Engineer</text>
  <text x="78" y="258" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Full-Stack · Backend · Applied AI</text>

  <g transform="translate(78 296)" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">
    <rect width="112" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="56" y="22" fill="#e2e8f0" text-anchor="middle">SKOPJE</text>
    <rect x="124" width="144" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="196" y="22" fill="#e2e8f0" text-anchor="middle">BUILDING APIs</text>
    <rect x="280" width="170" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.14"/>
    <text x="365" y="22" fill="#e2e8f0" text-anchor="middle">SHIPPING PRODUCTS</text>
  </g>

  <path d="M0 338 C210 302 360 380 594 340 C830 300 978 380 1200 328 L1200 360 L0 360Z" fill="#020617" fill-opacity="0.52"/>
  <path d="M0 345 C220 316 374 382 602 346 C830 310 980 381 1200 337" fill="none" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.25;0.85;0.25" dur="4s" repeatCount="indefinite"/>
  </path>
</svg>
